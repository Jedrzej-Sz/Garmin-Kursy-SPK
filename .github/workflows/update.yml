name: Update SPK Bus Schedule

on:
  schedule:
    - cron: '37 4 * * *'   # Codziennie o 04:00 UTC (05:00/06:00 czasu PL)
  workflow_dispatch:      # Przycisk do ręcznego odpalenia w zakładce Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SPK parser
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_schedule.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/schedule.json docs/version.json pdfs.sha256
          if ! git diff --staged --quiet; then
            git commit -m "chore: update SPK schedule $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Brak zmian w rozkładzie."
          fi
